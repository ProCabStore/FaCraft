<style>
  :root {
    --color-background: #ffffff;
    --color-foreground: #f8f9fa;
    --color-text: #000000;
    --color-primary: #000000;
    --color-border-subtle: #e9ecef;
    --font-family-sans-serif: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --navbar-height: 70px;
    --navbar-padding: 1rem;
    --container-width: 1140px;
    --transition-speed: 0.2s;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-family-sans-serif); font-size: 1rem; line-height: 1.5; color: var(--color-text); background-color: var(--color-background); }
  ul { list-style: none; margin: 0; padding: 0; }
  a { text-decoration: none; color: var(--color-text); }
  .navbar {
    height: var(--navbar-height);
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--color-border-subtle);
    position: relative;
    z-index: 10;
  }
  .navbar__container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: var(--container-width);
    margin: 0 auto;
    padding: 0 var(--navbar-padding);
    position: relative;
  }
  .navbar__brand { font-size: 1.5rem; font-weight: 700; z-index: 1002; }
  .navbar__toggle {
    display: block;
    padding: 0.5rem;
    border: none;
    background: transparent;
    cursor: pointer;
    z-index: 1001;
  }
  .navbar__toggle .bar {
    display: block;
    width: 25px;
    height: 3px;
    margin: 5px auto;
    background-color: var(--color-text);
    transition: all var(--transition-speed) ease-in-out;
  }
  .navbar__toggle.is-active .bar:nth-child(2) { opacity: 0; }
  .navbar__toggle.is-active .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .navbar__toggle.is-active .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
  .navbar__menu {
    display: none;
    flex-direction: column;
    width: 100%;
    position: absolute;
    top: 100%;
    left: 0;
    background-color: var(--color-background);
    border-bottom: 1px solid var(--color-border-subtle);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    z-index: 1000;
  }
  .navbar__menu.is-active { display: flex; }
  .navbar__item { text-align: center; border-bottom: 1px solid var(--color-border-subtle); }
  .navbar__item:last-child { border-bottom: none; }
  .navbar__link {
    display: block;
    padding: 1.5rem;
    transition: background-color var(--transition-speed) ease;
  }
  .navbar__link:hover, .navbar__link:focus { background-color: var(--color-foreground); }
  @media (min-width: 768px) {
    .navbar__toggle { display: none; }
    .navbar__menu {
      display: flex;
      align-items: center;
      position: static;
      width: auto;
      background-color: transparent;
      border: none;
      box-shadow: none;
      margin-left: auto;
    }
    .navbar__list { display: flex; align-items: center; }
    .navbar__item { border: none; margin-left: 0.5rem; }
    .navbar__link {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border-bottom: 2px solid transparent;
    }
    .navbar__link:hover, .navbar__link:focus {
      background-color: transparent;
      border-bottom-color: var(--color-primary);
    }
  }
</style>

<script>
  (function() {
    const toggleBtn = document.getElementById('navbarToggle');
    const menu = document.getElementById('navbarMenu');
    if (toggleBtn && menu) {
      toggleBtn.addEventListener('click', () => {
        const expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
        toggleBtn.setAttribute('aria-expanded', !expanded);
        toggleBtn.classList.toggle('is-active');
        menu.classList.toggle('is-active');
      });
    }
  })();
</script>
