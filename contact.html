<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - FA CRAFT</title>
  <meta name="description" content="Get in touch with FA CRAFT via WhatsApp or TikTok. We reply within hours." />
  <meta property="og:title" content="FA CRAFT – Contact" />
  <meta property="og:description" content="Reach out for custom orders or inquiries." />
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪵</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; color: #1a1a1a; line-height: 1.5; }
    .container { max-width: 600px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-header { margin-bottom: 2rem; text-align: center; }
    .page-header h1 { font-size: 1.8rem; font-weight: 600; color: #111; margin-bottom: 0.25rem; }
    .page-header p { color: #555; font-size: 0.95rem; }
    .links-list { display: flex; flex-direction: column; gap: 1rem; margin: 2rem 0; }
    .contact-link { display: flex; align-items: center; gap: 1rem; background: #f5f5f5; padding: 1rem 1.25rem; border-radius: 14px; text-decoration: none; transition: all 0.2s ease; border: 1px solid #eaeaea; }
    .contact-link:hover { background: #eeeeee; border-color: #ccc; transform: translateY(-1px); }
    .link-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    .link-content { flex: 1; }
    .link-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.2rem; }
    .link-sub { font-size: 0.8rem; color: #666; }
    .arrow { color: #999; font-size: 1.2rem; }
    .note { background: #fafafa; padding: 1rem 1.25rem; border-radius: 14px; border-left: 3px solid #ccc; margin-top: 2rem; }
    .note p { font-size: 0.85rem; color: #555; margin-bottom: 0.5rem; }
    .footer-note { text-align: center; margin-top: 2.5rem; font-size: 0.75rem; color: #aaa; border-top: 1px solid #eee; padding-top: 1.5rem; }
    .back-to-top { position: fixed; bottom: 20px; right: 20px; background: #1F2A1B; color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.3s; z-index: 99; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .back-to-top.visible { opacity: 1; }
    @media (max-width: 480px) {
      .container { padding: 1.5rem 1rem; }
      .contact-link { padding: 0.875rem 1rem; }
      .link-title { font-size: 1rem; }
      .link-icon { width: 32px; font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container">
  <div class="page-header">
    <h1>Get in touch</h1>
    <p>Reach out anytime — we're here to help</p>
  </div>
  <div class="links-list">
    <a href="https://www.tiktok.com/@pejo_00?_r=1&_t=ZS-96rhsKmuVBi" target="_blank" rel="noopener noreferrer" class="contact-link tiktok">
      <div class="link-icon">🎵</div>
      <div class="link-content">
        <div class="link-title">TikTok</div>
        <div class="link-sub">Follow for updates & behind the scenes</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a href="https://wa.me/601111213149" target="_blank" rel="noopener noreferrer" class="contact-link whatsapp">
      <div class="link-icon">💬</div>
      <div class="link-content">
        <div class="link-title">WhatsApp</div>
        <div class="link-sub">Direct chat • +60 1111-213 149</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
  <div class="note">
    <p>📱 Prefer messaging? Tap WhatsApp for quick replies.</p>
    <p>🎬 Catch our latest rides and promos on TikTok.</p>
  </div>
  <div class="footer-note">
    ProCab — We'll get back to you within a few hours
  </div>
</div>
<div class="back-to-top" id="backToTop"><i class="fas fa-arrow-up"></i></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
<script>
  (function() {
    const navbarPlaceholder = document.getElementById('navbar-placeholder');
    if (!navbarPlaceholder) return;
    fetch('navbar.html')
      .then(response => { if (!response.ok) throw new Error(); return response.text(); })
      .then(html => { navbarPlaceholder.innerHTML = html; const toggleBtn = document.getElementById('navbarToggle'); const menu = document.getElementById('navbarMenu'); if (toggleBtn && menu) { const newBtn = toggleBtn.cloneNode(true); toggleBtn.parentNode?.replaceChild(newBtn, toggleBtn); newBtn.addEventListener('click', () => { const expanded = newBtn.getAttribute('aria-expanded') === 'true'; newBtn.setAttribute('aria-expanded', !expanded); newBtn.classList.toggle('is-active'); menu.classList.toggle('is-active'); }); } })
      .catch(() => { navbarPlaceholder.innerHTML = `<nav style="background:#fff; border-bottom:1px solid #eee; padding:0.75rem 1.5rem;"><div style="max-width:600px; margin:0 auto; display:flex; gap:1.5rem; font-size:0.9rem;"><a href="index.html" style="color:#333; text-decoration:none;">Home</a><a href="about.html" style="color:#333; text-decoration:none;">About</a><a href="contact.html" style="color:#000; font-weight:500; text-decoration:none;">Contact</a></div></nav>`; });
  })();
  window.addEventListener('scroll', () => { const btn = document.getElementById('backToTop'); if(window.scrollY > 300) btn.classList.add('visible'); else btn.classList.remove('visible'); });
  document.getElementById('backToTop').addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });
</script>
</body>
</html>
